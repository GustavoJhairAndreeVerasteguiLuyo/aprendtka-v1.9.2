<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APRENDTK | Colegio Privado San Vicente</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(135deg,#0B2C6A,#1D4ED8,#3B82F6);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

}

/* Círculos decorativos */

body::before{

content:"";

position:absolute;

width:550px;
height:550px;

background:rgba(255,255,255,.07);

border-radius:50%;

top:-220px;
left:-150px;

}

body::after{

content:"";

position:absolute;

width:450px;
height:450px;

background:rgba(255,255,255,.06);

border-radius:50%;

bottom:-180px;
right:-150px;

}

.card{

position:relative;

z-index:10;

width:430px;

background:white;

border-radius:30px;

padding:45px;

box-shadow:

0 30px 70px rgba(0,0,0,.25);

animation:fade .8s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

display:block;

margin:auto;

width:110px;

margin-bottom:18px;

}

h1{

text-align:center;

color:#0B2C6A;

font-size:34px;

margin-bottom:8px;

font-weight:700;

}

.school{

text-align:center;

color:#666;

font-size:14px;

line-height:1.7;

margin-bottom:35px;

}

.input{

margin-bottom:20px;

position:relative;

}

.input svg{

position:absolute;

left:16px;

top:16px;

width:20px;

height:20px;

fill:#999;

}

input{

width:100%;

padding:15px 18px 15px 50px;

border:2px solid #E5E7EB;

border-radius:15px;

font-size:15px;

transition:.30s;

outline:none;

}

input:focus{

border-color:#2563EB;

box-shadow:0 0 0 4px rgba(37,99,235,.12);

}

button{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:linear-gradient(135deg,#E11D48,#EF4444);

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.30s;

margin-top:8px;

}

button:hover{

transform:translateY(-3px);

box-shadow:0 15px 30px rgba(225,29,72,.35);

}

.links{

margin-top:25px;

display:flex;

justify-content:space-between;

}

.links a{

text-decoration:none;

color:#1D4ED8;

font-size:14px;

font-weight:500;

transition:.3s;

}

.links a:hover{

color:#E11D48;

}

.footer{

margin-top:35px;

text-align:center;

font-size:12px;

color:#999;

line-height:1.8;

}

@media(max-width:500px){

.card{

width:92%;
padding:35px;

}

}

</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo">

<h1>APRENDTK</h1>

<p class="school">

<b>Colegio Privado San Vicente</b>

<br>

Plataforma Educativa para el aprendizaje de Programación, Inteligencia Artificial, Matemática, Física, Electrónica y Robótica.

</p>

<form>

<div class="input">

<svg viewBox="0 0 24 24">
<path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 2-8 5L4 6h16zm0 12H4V8l8 5 8-5v10z"/>
</svg>

<input
type="email"
placeholder="Correo electrónico"
required>

</div>

<div class="input">

<svg viewBox="0 0 24 24">
<path d="M17 8h-1V6a4 4 0 10-8 0v2H7a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2zm-6 0V6a2 2 0 114 0v2h-4z"/>
</svg>

<input
type="password"
placeholder="Contraseña"
required>

</div>

<button>

Iniciar Sesión

</button>

</form>

<div class="links">

<a href="#">Crear cuenta</a>

<a href="#">¿Olvidaste tu contraseña?</a>

</div>

<div class="footer">

© 2026 APRENDTK

<br>

Colegio Privado San Vicente

</div>

</div>

</body>

</html>
