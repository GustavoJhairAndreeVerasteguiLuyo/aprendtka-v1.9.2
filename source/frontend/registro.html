<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APRENDTK | Registro Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --secondary:#06b6d4;
    --bg-dark:#071028;
    --card:#0f172a;
    --card-2:#111c36;
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --text-soft:#cbd5e1;
    --input-bg:rgba(255,255,255,0.05);
    --shadow:0 25px 60px rgba(0,0,0,0.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top left, rgba(37,99,235,0.35), transparent 28%),
        radial-gradient(circle at bottom right, rgba(6,182,212,0.28), transparent 30%),
        linear-gradient(135deg,#020617 0%, #071028 45%, #0f172a 100%);
    position:relative;
    padding:40px 20px;
}

/* EFECTOS DE FONDO */

body::before,
body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.22;
    z-index:0;
}

body::before{
    background:#2563eb;
    top:-180px;
    left:-150px;
}

body::after{
    background:#06b6d4;
    bottom:-200px;
    right:-150px;
}

/* CARD */

.container{
    position:relative;
    z-index:1;

    width:100%;
    max-width:520px;

    background:rgba(15,23,42,0.78);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid var(--border);

    border-radius:32px;

    padding:42px;

    box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.08);

    overflow:hidden;

    animation:fadeUp .9s ease;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.06),
            transparent 40%
        );
    pointer-events:none;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* HEADER */

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:32px;
}

.logo{
    width:68px;
    height:68px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb,
            #1d4ed8
        );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:1.7rem;
    font-weight:800;
    color:white;

    box-shadow:
        0 12px 30px rgba(37,99,235,0.45);
}

.brand-info h1{
    color:var(--text);
    font-size:1.9rem;
    font-weight:800;
    letter-spacing:-1px;
}

.brand-info p{
    color:var(--text-soft);
    margin-top:4px;
    font-size:.95rem;
}

/* FORM */

.form-grid{
    display:grid;
    gap:20px;
}

.field{
    position:relative;
}

.field label{
    display:block;
    color:#f8fafc;
    font-size:.93rem;
    margin-bottom:9px;
    font-weight:600;
}

.input-box{
    position:relative;
}

.field input{
    width:100%;
    padding:16px 18px 16px 18px;

    border-radius:18px;
    border:1px solid rgba(255,255,255,0.08);

    background:var(--input-bg);

    color:white;

    outline:none;

    font-size:.96rem;

    transition:.35s ease;
}

.field input::placeholder{
    color:#94a3b8;
}

.field input:hover{
    border-color:rgba(255,255,255,0.15);
}

.field input:focus{
    background:rgba(255,255,255,0.08);

    border-color:rgba(56,189,248,0.75);

    box-shadow:
        0 0 0 5px rgba(56,189,248,0.12),
        0 10px 25px rgba(37,99,235,0.18);

    transform:translateY(-1px);
}

/* BARRA SUPERIOR DECORATIVA */

.top-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;

    background:
        linear-gradient(
            90deg,
            #06b6d4,
            #2563eb,
            #7c3aed
        );
}

/* BOTÓN */

.actions{
    margin-top:12px;
}

.actions button{
    width:100%;

    border:none;

    padding:18px;

    border-radius:18px;

    cursor:pointer;

    font-size:1rem;
    font-weight:700;

    color:white;

    background:
        linear-gradient(
            135deg,
            #0ea5e9,
            #2563eb
        );

    transition:.35s ease;

    box-shadow:
        0 15px 35px rgba(37,99,235,0.38);
}

.actions button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 20px 45px rgba(37,99,235,0.55);

    filter:brightness(1.05);
}

.actions button:active{
    transform:scale(.985);
}

/* FOOTER */

.footer{
    margin-top:26px;
    text-align:center;
    color:#94a3b8;
    font-size:.85rem;
}

/* DECORACIONES */

.circle{
    position:absolute;
    border-radius:50%;
    z-index:0;
}

.circle.one{
    width:130px;
    height:130px;
    background:rgba(37,99,235,0.18);
    top:-45px;
    right:-45px;
}

.circle.two{
    width:90px;
    height:90px;
    background:rgba(6,182,212,0.14);
    bottom:-30px;
    left:-25px;
}

/* RESPONSIVE */

@media(max-width:600px){

    .container{
        padding:32px 24px;
        border-radius:26px;
    }

    .brand{
        flex-direction:column;
        text-align:center;
    }

    .brand-info h1{
        font-size:1.6rem;
    }

    .logo{
        width:62px;
        height:62px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="top-bar"></div>

    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="brand">

        <div class="logo">
            A
        </div>

        <div class="brand-info">
            <h1>Registro Premium</h1>
            <p>Bienvenido a APRENDTK Platform</p>
        </div>

    </div>

    <form action="#" method="post">

        <div class="form-grid">

            <div class="field">
                <label>Nombre completo</label>

                <div class="input-box">
                    <input
                        type="text"
                        placeholder="Ingresa tu nombre completo"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>DNI</label>

                <div class="input-box">
                    <input
                        type="text"
                        placeholder="Ejemplo: 74859621"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>Celular</label>

                <div class="input-box">
                    <input
                        type="tel"
                        placeholder="Ejemplo: 987654321"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>Código de producto</label>

                <div class="input-box">
                    <input
                        type="text"
                        placeholder="Código asignado: Lo encuentras en la tapa del libro"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>Nombre de usuario</label>

                <div class="input-box">
                    <input
                        type="text"
                        placeholder="Crea tu usuario"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>Contraseña</label>

                <div class="input-box">
                    <input
                        type="password"
                        placeholder="Crea una contraseña segura"
                        required
                    >
                </div>
            </div>

        </div>

        <div class="actions">
            <button type="submit">
                Crear cuenta
            </button>
        </div>

    </form>

    <div class="footer">
        © 2026 APRENDTK • Diseño UI Moderno
    </div>

</div>

</body>
</html>
